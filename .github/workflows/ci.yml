name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Mint tools
        uses: irgaly/setup-mint@8566ee44b3a79d20642d1924db21c8ab0402859f # v1
        with:
          mint-directory: .
          mint-executable-directory: /usr/local/bin
          bootstrap: true
          bootstrap-link: true
          use-cache: true
          cache-prefix: macos-15
          clean: true
      - name: Check formatting and linting
        run: scripts/lint

  macos:
    name: macOS
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Apple toolchain
        run: scripts/verify-apple-toolchain
      - name: Test and collect coverage
        run: scripts/coverage swiftpm macos
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: .build/coverage/macos.lcov
          flags: macos
          name: macos
          plugins: noop
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ios:
    name: iOS
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Apple toolchain
        run: scripts/verify-apple-toolchain
      - name: Build, test, and collect coverage
        run: scripts/coverage ios
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: .build/coverage/ios.lcov
          flags: ios
          name: ios
          plugins: noop
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    container:
      # Official swift:6.4.0-noble release image
      image: >-
        swift@sha256:64bab762bc73a3fda6d9ebc559258bd6d7660c10a705bb25ecacad2f99d066f9
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Linux toolchain and runtime
        run: |
          swift --version | tee /tmp/swift-version
          grep --fixed-strings 'Swift version 6.4 (swift-6.4-RELEASE)' /tmp/swift-version
          grep --fixed-strings 'Target: x86_64-unknown-linux-gnu' /tmp/swift-version
          test "$(dpkg --print-architecture)" = amd64
          curl_version=$(dpkg-query -W '-f=${Version}' libcurl4-openssl-dev)
          printf 'libcurl4-openssl-dev %s\n' "$curl_version"
          dpkg --compare-versions "$curl_version" ge 8.5.0-2ubuntu10.13
          dpkg --compare-versions "$curl_version" lt 8.5.0-2ubuntu11
          Spikes/ToolchainAvailability/run linux
      - name: Test and collect coverage
        run: scripts/coverage swiftpm linux
      - name: Install Codecov upload dependency
        run: |
          apt-get update
          apt-get install --yes curl
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: .build/coverage/linux.lcov
          flags: linux
          name: linux
          plugins: noop
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
