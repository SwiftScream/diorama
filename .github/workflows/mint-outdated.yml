name: Mint updates

on:
  schedule:
    - cron: '23 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mint-updates
  cancel-in-progress: true

jobs:
  outdated:
    name: Report outdated Mint tools
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Mint
        uses: irgaly/setup-mint@d82f385e689a86ea68f08bb5c3a9821c0373cb52 # v1
        with:
          mint-directory: .
          mint-executable-directory: /usr/local/bin
          bootstrap: false
          bootstrap-link: false
          use-cache: true
          cache-prefix: macos-15-outdated
          clean: false
      - name: Report outdated tools
        run: mint outdated
