disabled_rules:
  # Keep related code together; file length does not determine design quality.
  - file_length
  # SwiftFormat's redundantNilInit rule owns this transformation.
  - implicit_optional_initialization
  # SwiftFormat owns brace spacing and multiline declaration brace placement.
  - opening_brace

opt_in_rules:
  - missing_docs

excluded:
  - .build
  - .swiftpm

trailing_comma:
  mandatory_comma: true

vertical_whitespace:
  max_empty_lines: 2

nesting:
  type_level: 2

type_body_length:
  warning: 500
  error: 500
