disabled_rules:
  # SwiftFormat's redundantNilInit rule owns this transformation.
  - implicit_optional_initialization
  # SwiftFormat owns brace spacing and multiline declaration brace placement.
  - opening_brace

opt_in_rules:
  - missing_docs

excluded:
  - .build
  - .swiftpm

trailing_comma:
  mandatory_comma: true

vertical_whitespace:
  max_empty_lines: 2

nesting:
  type_level: 2

type_body_length:
  warning: 500
  error: 500

file_length:
  warning: 750
  error: 1250
