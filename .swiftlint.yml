disabled_rules:
  # SwiftFormat's redundantNilInit rule owns this transformation.
  - implicit_optional_initialization
  # SwiftFormat owns brace spacing and multiline declaration brace placement.
  - opening_brace

opt_in_rules:
  - missing_docs

excluded:
  - .build
  - .swiftpm

trailing_comma:
  mandatory_comma: true

vertical_whitespace:
  max_empty_lines: 2

nesting:
  type_level: 2

# Keep lease finalization beside its private state and reservation helpers.
file_length:
  warning: 600
  error: 1000
